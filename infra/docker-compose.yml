# ThreadsFlow — 4GB RAM / 2 vCPU Debian, no open ports (Cloudflare Tunnel only).
# Peak RSS target: ~2.1GB. Everything else is headroom for n8n spikes.
# Images go to Cloudflare R2 (public bucket, free tier, no egress cost).
#
#   cp .env.example .env && edit
#   docker compose up -d
#   docker compose exec -T postgres psql -U threadsflow -d threadsflow < ../db/schema.sql
#   docker compose exec -T postgres psql -U threadsflow -d threadsflow < ../db/seed_levers_my.sql

name: threadsflow

# 72h canary: json-file rotation on every long-running service so debug logging can
# never fill the disk (5 files x 10MB = max 50MB per container).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: threadsflow
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: threadsflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres -c shared_buffers=192MB -c effective_cache_size=512MB
               -c work_mem=8MB -c maintenance_work_mem=64MB
               -c max_connections=40
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadsflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512M }

  n8n:
    # Pinned deliberately. `:latest` now resolves to n8n v2.x, whose breaking
    # changes (workflow publish/unpublish replacing the active flag, task
    # runners, blocked env access in Code nodes) can take a working deployment
    # down on an unrelated `docker compose up -d`. This repo's workflows and
    # tooling target the 1.x line. Bump on purpose, after reading:
    #   https://docs.n8n.io/changelog/v20-breaking-changes
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-1.123.67}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: threadsflow
      DB_POSTGRESDB_USER: threadsflow
      DB_POSTGRESDB_PASSWORD: ${PG_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n            # keep n8n tables out of your app schema
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
      GENERIC_TIMEZONE: Asia/Kuala_Lumpur
      TZ: Asia/Kuala_Lumpur
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # NOTE: N8N_BASIC_AUTH_ACTIVE/USER/PASSWORD used to be set here. They were
      # removed in n8n v1 and are ignored in v2, so they protected nothing.
      # Access is now controlled by (a) the n8n owner account created by
      # scripts/bootstrap_n8n.sh (login is N8N_USER/N8N_PASSWORD from .env) and
      # (b) the Cloudflare Access policy on the n8n hostname.
      # ── memory + disk discipline on a small box
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      N8N_PAYLOAD_SIZE_MAX: "32"
      NODE_OPTIONS: --max-old-space-size=1024
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      # Exposed for expressions/manual testing; imported workflows primarily read settings.llm.
      LLM_BASE_URL: ${LLM_BASE_URL:-https://9router.archxry.space/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_WRITE: ${LLM_MODEL_WRITE:-gemini-2.5-flash}
      LLM_MODEL_EDIT: ${LLM_MODEL_EDIT:-gpt-4.1-mini}
      LLM_MODEL_MINE: ${LLM_MODEL_MINE:-gemini-2.5-pro}
      LLM_MODEL_EMBED: ${LLM_MODEL_EMBED:-text-embedding-3-small}
      PUBLIC_REDIRECT_BASE: ${PUBLIC_REDIRECT_BASE:-https://r.yourdomain.com}
      # Perplexity (optional, for persona topic discovery):
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      PERPLEXITY_BASE_URL: ${PERPLEXITY_BASE_URL:-https://api.perplexity.ai}
      PERPLEXITY_MODEL: ${PERPLEXITY_MODEL:-sonar}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8ndata:/home/node/.n8n
      - ../n8n/code:/code:ro              # Code nodes can `require` nothing, but handy for copy/paste
    deploy:
      resources:
        limits: { memory: 1400M }

  redirector:
    build: ../services/redirector
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://threadsflow:${PG_PASSWORD}@postgres:5432/threadsflow
      IP_SALT: ${IP_SALT}
      FALLBACK_URL: https://shopee.com.my
      PORT: "8081"
      DEBUG_MODE: ${DEBUG_MODE:-false}
      DEBUG_UNTIL: ${DEBUG_UNTIL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    deploy:
      resources:
        limits: { memory: 128M }


  kb:
    build: ../services/kb
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://threadsflow:${PG_PASSWORD}@postgres:5432/threadsflow
      PORT: "8082"
      KB_PASSWORD: ${KB_PASSWORD}
      STORAGE_DIR: /data/pdfs
      IMAGE_DIR: /data/images
      IMAGE_BACKEND: ${IMAGE_BACKEND}
      PUBLIC_IMAGE_BASE: ${PUBLIC_IMAGE_BASE}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_KEY: ${S3_KEY}
      S3_SECRET: ${S3_SECRET}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://9router.archxry.space/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_WRITE: ${LLM_MODEL_WRITE:-gemini-2.5-flash}
      LLM_MODEL_EDIT: ${LLM_MODEL_EDIT:-gpt-4.1-mini}
      LLM_MODEL_MINE: ${LLM_MODEL_MINE:-gemini-2.5-pro}
      LLM_MODEL_EMBED: ${LLM_MODEL_EMBED:-text-embedding-3-small}
      # Optional. Product intake still works without approval; with keys it also gets
      # authoritative Shopee price/commission data.
      SHOPEE_API_APP_ID: ${SHOPEE_API_APP_ID:-}
      SHOPEE_API_SECRET: ${SHOPEE_API_SECRET:-}
      SHOPEE_OPENAPI_URL: ${SHOPEE_OPENAPI_URL:-https://open-api.affiliate.shopee.com.my/graphql}
      MINE_CONCURRENCY: "2"
      MAX_CHUNKS_PER_DOC: "45"
      DEBUG_MODE: ${DEBUG_MODE:-false}
      DEBUG_UNTIL: ${DEBUG_UNTIL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: Asia/Kuala_Lumpur
      # Perplexity (optional, for persona topic refresh):
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      PERPLEXITY_BASE_URL: ${PERPLEXITY_BASE_URL:-https://api.perplexity.ai}
      PERPLEXITY_MODEL: ${PERPLEXITY_MODEL:-sonar}
    volumes:
      - kbdata:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits: { memory: 640M }

  # ── Shopee Affiliate Open API conversion sync. Same image as kb; runs bin/shopee.mjs
  # cron (pulls conversions every 12h, self-heals if keys are missing). This is the
  # wf5 piece — once you set SHOPEE_API_APP_ID / SHOPEE_API_SECRET in .env and
  # `docker compose up -d`, money data flows into the learning loop automatically.
  shopee-sync:
    build: ../services/kb
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres: { condition: service_healthy }
    command: ["node", "bin/shopee.mjs", "cron"]
    environment:
      DATABASE_URL: postgres://threadsflow:${PG_PASSWORD}@postgres:5432/threadsflow
      SHOPEE_API_APP_ID: ${SHOPEE_API_APP_ID:-}
      SHOPEE_API_SECRET: ${SHOPEE_API_SECRET:-}
      SHOPEE_OPENAPI_URL: ${SHOPEE_OPENAPI_URL:-https://open-api.affiliate.shopee.com.my/graphql}
      SHOPEE_LOOKBACK_DAYS: ${SHOPEE_LOOKBACK_DAYS:-7}
      SHOPEE_VALIDATION_ID: ${SHOPEE_VALIDATION_ID:-}
      DEBUG_MODE: ${DEBUG_MODE:-false}
      DEBUG_UNTIL: ${DEBUG_UNTIL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_OPTIONS: --max-old-space-size=128
      TZ: Asia/Kuala_Lumpur
    deploy:
      resources:
        limits: { memory: 160M }

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging: *default-logging
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on: [n8n, redirector]
    deploy:
      resources:
        limits: { memory: 96M }

volumes:
  pgdata:
  n8ndata:
  kbdata:

# ── Cloudflare Tunnel public hostnames to configure in the Zero Trust dashboard:
#   n8n.yourdomain.com  → http://n8n:5678         (put an Access policy on this!)
#   kb.yourdomain.com   → http://kb:8082          (Access policy: your email only)
#   r.yourdomain.com    → http://redirector:8081  (PUBLIC, no Access — buyers hit this)
#
#   Images are served from Cloudflare R2 (public bucket, no egress cost).
#   If IMAGE_BACKEND=local the kb service at :8082 also serves /img — point
#   cdn.yourdomain.com → http://kb:8082  (PUBLIC, no Access — Meta fetches images).
