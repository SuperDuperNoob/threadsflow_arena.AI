<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ThreadsFlow — Review Dashboard (/queue.html)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #0f172a; color: #f8fafc; }
    h1 { margin-top: 0; color: #38bdf8; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    button { background: #334155; color: #f8fafc; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; }
    button.active { background: #0ea5e9; color: #fff; }
    button:hover { background: #475569; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .badge-exploration { background: #8b5cf6; color: #fff; }
    .badge-pending { background: #eab308; color: #000; }
    textarea { width: 100%; height: 100px; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 4px; padding: 8px; font-family: inherit; margin: 8px 0; }
    select { background: #0f172a; color: #f8fafc; border: 1px solid #475569; padding: 6px; border-radius: 4px; margin-right: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #334155; font-size: 14px; }
    th { color: #94a3b8; }
    .actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .btn-approve { background: #22c55e; color: #fff; }
    .btn-reject { background: #ef4444; color: #fff; }
    .btn-edit { background: #3b82f6; color: #fff; }
    .countdown { color: #38bdf8; font-weight: bold; }
  </style>
</head>
<body>
  <h1>ThreadsFlow Review Queue</h1>
  <div class="tabs">
    <button class="active" onclick="switchTab('queue')">Daily Queue</button>
    <button onclick="switchTab('summary')">Weekly Summary & Stats</button>
    <button onclick="location.href='/'" style="margin-left:auto">Back to KB</button>
  </div>

  <div id="queue" class="tab-content active">
    <h2>Pending Review (<span id="count">0</span>)</h2>
    <div id="queueList">Loading queue...</div>
  </div>

  <div id="summary" class="tab-content">
    <h2>Review Status Counts</h2>
    <div id="statusCounts" style="margin-bottom: 20px;">Loading...</div>
    <h2>Arm Stats (Bandit Performance)</h2>
    <div id="armStats">Loading...</div>
    <h2>Recent Review Audit</h2>
    <div id="auditLog">Loading...</div>
  </div>

  <script>
    function switchTab(name) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tabs button').forEach(el => el.classList.remove('active'));
      document.getElementById(name).classList.add('active');
      event.target.classList.add('active');
      if (name === 'summary') loadSummary();
    }

    async function loadQueue() {
      try {
        const res = await fetch('/api/posts/queue');
        if (res.status === 401) return location.href = '/';
        const posts = await res.json();
        document.getElementById('count').textContent = posts.length;
        const list = document.getElementById('queueList');
        if (!posts.length) {
          list.innerHTML = '<p>No posts currently pending review. All clear! 🎉</p>';
          return;
        }
        list.innerHTML = posts.map(p => {
          const timeoutTime = new Date(p.review_timeout_at).getTime();
          const diffSec = Math.max(0, Math.floor((timeoutTime - Date.now()) / 1000));
          const mins = Math.floor(diffSec / 60);
          const secs = diffSec % 60;
          const timeStr = `${mins}m ${secs}s`;

          return `
            <div class="card" data-id="${p.id}" onfocusin="lockPost(${p.id})">
              <div>
                <span class="badge badge-pending">${p.status}</span>
                ${p.is_exploration ? '<span class="badge badge-exploration">EXPLORATION PROBE</span>' : ''}
                <strong>UID:</strong> ${p.uid} | <strong>Product:</strong> ${p.product_name || 'N/A'} | <strong>Tone:</strong> ${p.tone} | <strong>Format:</strong> ${p.format}
                <br><small>Scheduled: ${new Date(p.scheduled_at).toLocaleString()} | Auto-publish timeout in: <span class="countdown" id="cd-${p.id}">${timeStr}</span></small>
              </div>
              <textarea id="body-${p.id}">${escapeHtml(p.edited_body || p.body)}</textarea>
              <div class="actions">
                <button class="btn-approve" onclick="reviewAction(${p.id}, 'approved')">Approve</button>
                <button class="btn-edit" onclick="reviewAction(${p.id}, 'edited')">Save & Approve Edit</button>
                <select id="reason-${p.id}">
                  <option value="off_tone">Off Tone</option>
                  <option value="factual_error">Factual Error</option>
                  <option value="too_salesy">Too Salesy</option>
                  <option value="banned_phrase_adjacent">Banned Phrase</option>
                  <option value="other">Other</option>
                </select>
                <button class="btn-reject" onclick="reviewAction(${p.id}, 'rejected')">Reject</button>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        document.getElementById('queueList').innerHTML = `<p style="color:#ef4444">Error loading queue: ${e.message}</p>`;
      }
    }

    async function lockPost(postId) {
      await fetch(`/api/posts/${postId}/lock`, { method: 'POST' }).catch(() => {});
    }

    async function reviewAction(postId, decision) {
      const body = { decision };
      if (decision === 'edited') {
        body.edited_body = document.getElementById(`body-${postId}`).value;
      }
      if (decision === 'rejected') {
        body.reason_code = document.getElementById(`reason-${postId}`).value;
      }
      const res = await fetch(`/api/posts/${postId}/decision`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (res.ok) {
        loadQueue();
      } else {
        const err = await res.json();
        alert('Action failed: ' + (err.error || 'unknown'));
      }
    }

    async function loadSummary() {
      try {
        const res = await fetch('/api/posts/weekly');
        const data = await res.json();
        
        document.getElementById('statusCounts').innerHTML = data.review_counts.map(r => 
          `<b>${r.status}:</b> ${r.count} &nbsp;&nbsp;`
        ).join('');

        document.getElementById('armStats').innerHTML = `
          <table>
            <tr><th>Kind</th><th>Code</th><th>N</th><th>Mean Reward</th><th>Alpha</th><th>Beta</th></tr>
            ${data.arm_stats.map(a => `<tr><td>${a.lever_kind}</td><td>${a.lever_code}</td><td>${a.n}</td><td>${a.mean_reward}</td><td>${a.alpha}</td><td>${a.beta}</td></tr>`).join('')}
          </table>
        `;

        document.getElementById('auditLog').innerHTML = `
          <table>
            <tr><th>Time</th><th>Post UID</th><th>Decision</th><th>Reason</th></tr>
            ${data.recent_audits.map(au => `<tr><td>${new Date(au.created_at).toLocaleString()}</td><td>${au.post_uid || au.post_id}</td><td><b>${au.decision}</b></td><td>${au.reason_code || '-'}</td></tr>`).join('')}
          </table>
        `;
      } catch (e) {
        console.error('Failed to load summary', e);
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    loadQueue();
    setInterval(loadQueue, 15000);
  </script>
</body>
</html>
